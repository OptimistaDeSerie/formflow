server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's built-in DNS. Asking it again every 10 seconds means that when the
    # backend container is replaced during a deploy or rollback and gets a new
    # internal address, nginx follows it instead of pointing at the old one.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
